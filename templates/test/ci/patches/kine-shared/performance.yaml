apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureCluster
metadata:
  name: ${CLUSTER_NAME}
spec:
  networkSpec:
    subnets:
    - name: control-plane-subnet
      role: control-plane
      cidrBlocks:
      - 10.0.0.0/24
      securityGroup:
        securityRules:
        - name: allow-comparison-etcd-metrics
          priority: 2100
          direction: Inbound
          action: Allow
          protocol: Tcp
          source: 10.0.1.0/24
          sourcePorts: '*'
          destination: '*'
          destinationPorts: "2381"
        - name: deny-other-comparison-etcd-metrics
          priority: 2101
          direction: Inbound
          action: Deny
          protocol: Tcp
          source: '*'
          sourcePorts: '*'
          destination: '*'
          destinationPorts: "2381"
    - name: node-subnet
      role: node
      cidrBlocks:
      - 10.0.1.0/24
    vnet:
      cidrBlocks:
      - 10.0.0.0/16
  failureDomains:
    "1":
      controlPlane: ${KINE_ZONE_1}
    "2":
      controlPlane: ${KINE_ZONE_2}
    "3":
      controlPlane: ${KINE_ZONE_3}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-control-plane
spec:
  template:
    spec:
      acceleratedNetworking: true
      additionalCapabilities:
        ultraSSDEnabled: true
      dataDisks:
      - nameSuffix: etcddisk
        lun: 0
        diskSizeGB: ${KINE_DISK_SIZE_GB}
        cachingType: None
        managedDisk:
          storageAccountType: UltraSSD_LRS
      image:
        computeGallery:
          gallery: ClusterAPI-f72ceb4f-5159-4c26-a0fe-2ea738f0d019
          name: capi-azurelinux-4-gen2
          version: ${KINE_NODE_IMAGE_VERSION}
      osDisk:
        diskSizeGB: 128
        cachingType: ReadWrite
        managedDisk:
          storageAccountType: Premium_LRS
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  template:
    spec:
      acceleratedNetworking: true
      image:
        computeGallery:
          gallery: ClusterAPI-f72ceb4f-5159-4c26-a0fe-2ea738f0d019
          name: capi-azurelinux-4-gen2
          version: ${KINE_NODE_IMAGE_VERSION}
      osDisk:
        managedDisk:
          storageAccountType: Premium_LRS
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  template:
    spec:
      failureDomain: ${KINE_ZONE_YAML}
