apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  labels:
    cloud-provider: ${CLOUD_PROVIDER_AZURE_LABEL:=azure}
    cni: calico
  name: ${CLUSTER_NAME}
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: ${CLUSTER_NAME}-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: AzureCluster
    name: ${CLUSTER_NAME}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureCluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: default
spec:
  additionalTags:
    buildProvenance: ${BUILD_PROVENANCE}
    creationTimestamp: ${TIMESTAMP}
    jobName: ${JOB_NAME}
  failureDomains:
    "1":
      controlPlane: ${KINE_ZONE_1}
    "2":
      controlPlane: ${KINE_ZONE_2}
    "3":
      controlPlane: ${KINE_ZONE_3}
  identityRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: AzureClusterIdentity
    name: ${CLUSTER_IDENTITY_NAME}
  location: ${AZURE_LOCATION}
  networkSpec:
    subnets:
    - cidrBlocks:
      - 10.0.0.0/24
      name: control-plane-subnet
      role: control-plane
    - cidrBlocks:
      - 10.0.1.0/24
      name: node-subnet
      role: node
    vnet:
      cidrBlocks:
      - 10.0.0.0/16
      name: ${AZURE_VNET_NAME:=${CLUSTER_NAME}-vnet}
      peerings:
      - remoteVnetName: kine-vnet
        resourceGroup: ${KINE_RESOURCE_GROUP}
  resourceGroup: ${AZURE_RESOURCE_GROUP:=${CLUSTER_NAME}}
  subscriptionID: ${AZURE_SUBSCRIPTION_ID}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: ${CLUSTER_NAME}-control-plane
  namespace: default
spec:
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        extraArgs:
          feature-gates: ConcurrentWatchObjectDecode=true,ListFromCacheSnapshot=false
          service-account-issuer: ${SERVICE_ACCOUNT_ISSUER:-https://kubernetes.default.svc.cluster.local}
        timeoutForControlPlane: 20m
      controllerManager:
        extraArgs:
          allocate-node-cidrs: "false"
          cloud-provider: external
          cluster-name: ${CLUSTER_NAME}
          v: "4"
      etcd:
        external:
          caFile: /etc/kubernetes/pki/etcd/ca.crt
          certFile: /etc/kubernetes/pki/apiserver-etcd-client.crt
          endpoints:
          - https://10.250.0.4:2379
          keyFile: /etc/kubernetes/pki/apiserver-etcd-client.key
    diskSetup:
      filesystems:
      - device: ephemeral0.1
        filesystem: ext4
        label: ephemeral0
        replaceFS: ntfs
    files:
    - content: |
        #!/usr/bin/env bash
        set -euo pipefail
        role="$$1"
        shift
        case "$${role}" in
          control-plane|worker) ;;
          *) echo "Expected control-plane or worker role." >&2; exit 1 ;;
        esac
        [[ "$$#" -gt 0 ]] || { echo "Node subnet CIDRs are required." >&2; exit 1; }

        # shellcheck source=/dev/null
        source /etc/os-release
        case "$${VERSION_ID}" in
          3.*) package_manager=tdnf; packages=(ca-certificates ca-certificates-legacy) ;;
          4.*) package_manager=dnf; packages=(ca-certificates firewalld) ;;
          *) echo "Unsupported Azure Linux version: $${VERSION_ID}" >&2; exit 1 ;;
        esac
        if rpm -q "$${packages[@]}" >/dev/null; then
          echo "Azure Linux prerequisites are already installed."
        else
          for attempt in 1 2 3; do
            if "$${package_manager}" install -y "$${packages[@]}"; then
              break
            fi
            if [[ "$${attempt}" == 3 ]]; then
              echo "Failed to install Azure Linux prerequisites after 3 attempts." >&2
              exit 1
            fi
            echo "Azure Linux prerequisite installation failed (attempt $${attempt}/3); clearing repository metadata before retrying." >&2
            if ! "$${package_manager}" clean metadata; then
              echo "Failed to clear Azure Linux repository metadata." >&2
              exit 1
            fi
            sleep 5
          done
        fi
        update-ca-trust

        if command -v firewall-cmd >/dev/null 2>&1; then
          systemctl enable --now firewalld
          # Node, Pod, and Service traffic includes kubelet and Calico traffic.
          for cidr in "$$@" 192.168.0.0/16 10.96.0.0/12; do
            firewall-cmd --permanent --zone=trusted --add-source="$${cidr}"
          done
          firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="168.63.129.16" accept'
          if [[ "$${role}" == control-plane ]]; then
            firewall-cmd --permanent --add-port=6443/tcp
          fi
          firewall-cmd --reload
        else
          allow_iptables() {
            iptables -w -C "$$@" 2>/dev/null || iptables -w -I "$$@"
          }
          allow_iptables INPUT -i lo -j ACCEPT
          allow_iptables OUTPUT -o lo -j ACCEPT
          allow_iptables INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          allow_iptables OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          allow_iptables INPUT -s 168.63.129.16 -j ACCEPT
          allow_iptables OUTPUT -d 168.63.129.16 -j ACCEPT
          for cidr in "$$@" 192.168.0.0/16 10.96.0.0/12; do
            allow_iptables INPUT -s "$${cidr}" -j ACCEPT
            allow_iptables OUTPUT -d "$${cidr}" -j ACCEPT
            allow_iptables FORWARD -s "$${cidr}" -j ACCEPT
            allow_iptables FORWARD -d "$${cidr}" -j ACCEPT
          done
          if [[ "$${role}" == control-plane ]]; then
            allow_iptables INPUT -p tcp --dport 6443 -j ACCEPT
            allow_iptables OUTPUT -p tcp --dport 2379 -j ACCEPT
          fi
          iptables-save > /etc/systemd/scripts/ip4save
        fi
      owner: root:root
      path: /opt/azure-linux-setup.sh
      permissions: "0744"
    - contentFrom:
        secret:
          key: control-plane-azure.json
          name: ${CLUSTER_NAME}-control-plane-azure-json
      owner: root:root
      path: /etc/kubernetes/azure.json
      permissions: "0644"
    initConfiguration:
      nodeRegistration:
        ignorePreflightErrors:
        - ExternalEtcdVersion
        kubeletExtraArgs:
          cloud-provider: external
        name: '{{ ds.meta_data["local_hostname"] }}'
    joinConfiguration:
      nodeRegistration:
        ignorePreflightErrors:
        - ExternalEtcdVersion
        kubeletExtraArgs:
          cloud-provider: external
        name: '{{ ds.meta_data["local_hostname"] }}'
    postKubeadmCommands: []
    preKubeadmCommands:
    - bash /opt/azure-linux-setup.sh control-plane ${AZURE_LINUX_NODE_CIDRS:-10.0.0.0/24
      10.1.0.0/24} || exit 1
    verbosity: 10
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: AzureMachineTemplate
      name: ${CLUSTER_NAME}-control-plane
  replicas: ${CONTROL_PLANE_MACHINE_COUNT:=1}
  version: ${KUBERNETES_VERSION}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-control-plane
  namespace: default
spec:
  template:
    spec:
      acceleratedNetworking: true
      additionalTags:
        monitoring: virtualmachine
      identity: UserAssigned
      image:
        computeGallery:
          gallery: ClusterAPI-f72ceb4f-5159-4c26-a0fe-2ea738f0d019
          name: capi-azurelinux-4-gen2
          version: ${KINE_NODE_IMAGE_VERSION}
      osDisk:
        diskSizeGB: 128
        managedDisk:
          storageAccountType: Premium_LRS
        osType: Linux
      sshPublicKey: ${AZURE_SSH_PUBLIC_KEY_B64:=""}
      userAssignedIdentities:
      - providerID: azure:///subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CI_RG:=capz-ci}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${USER_IDENTITY:=cloud-provider-user-identity}
      vmSize: ${AZURE_CONTROL_PLANE_MACHINE_TYPE}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: default
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT:=2}
  selector: {}
  template:
    metadata:
      labels:
        nodepool: pool1
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: ${CLUSTER_NAME}-md-0
      clusterName: ${CLUSTER_NAME}
      failureDomain: ${KINE_ZONE_YAML}
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AzureMachineTemplate
        name: ${CLUSTER_NAME}-md-0
      version: ${KUBERNETES_VERSION}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: default
spec:
  template:
    spec:
      acceleratedNetworking: true
      additionalTags:
        monitoring: virtualmachine
      identity: UserAssigned
      image:
        computeGallery:
          gallery: ClusterAPI-f72ceb4f-5159-4c26-a0fe-2ea738f0d019
          name: capi-azurelinux-4-gen2
          version: ${KINE_NODE_IMAGE_VERSION}
      osDisk:
        diskSizeGB: 128
        managedDisk:
          storageAccountType: Premium_LRS
        osType: Linux
      sshPublicKey: ${AZURE_SSH_PUBLIC_KEY_B64:=""}
      userAssignedIdentities:
      - providerID: azure:///subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CI_RG:=capz-ci}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${USER_IDENTITY:=cloud-provider-user-identity}
      vmExtensions:
      - name: CustomScript
        protectedSettings:
          commandToExecute: |
            #!/bin/sh
            echo "This script is a no-op used for extension testing purposes ..."
            touch test_file
        publisher: Microsoft.Azure.Extensions
        version: "2.1"
      vmSize: ${AZURE_NODE_MACHINE_TYPE}
---
