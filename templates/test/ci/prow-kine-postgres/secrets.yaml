apiVersion: v1
kind: Secret
metadata:
  name: ${CLUSTER_NAME}-etcd
type: cluster.x-k8s.io/secret
data:
  tls.crt: ${KINE_CA_CERT_B64}
---
apiVersion: v1
kind: Secret
metadata:
  name: ${CLUSTER_NAME}-apiserver-etcd-client
type: kubernetes.io/tls
data:
  tls.crt: ${KINE_CLIENT_CERT_B64}
  tls.key: ${KINE_CLIENT_KEY_B64}
