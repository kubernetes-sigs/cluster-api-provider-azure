apiVersion: v1
kind: Secret
metadata:
  name: ${ASO_CREDENTIAL_SECRET_NAME}
  labels:
    # clusterctl move only carries Secrets it can link to a Cluster; this credential is referenced
    # by name from the credential-from annotation, so it must be labeled to move with the cluster.
    clusterctl.cluster.x-k8s.io/move: "true"
stringData:
 AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID}
 AZURE_TENANT_ID:       ${AZURE_TENANT_ID}
 AZURE_CLIENT_ID:       ${AZURE_CLIENT_ID_USER_ASSIGNED_IDENTITY}
 AUTH_MODE:             ${ASO_CREDENTIAL_SECRET_MODE:-workloadidentity}
