#cloud-config
package_update: true
packages:
- ca-certificates
- curl
- postgresql-16
- etcd-client
write_files:
- path: /opt/mount-datastore-disk.sh
  permissions: "0700"
  encoding: b64
  content: __DISK_SCRIPT__
- path: /usr/local/bin/check-datastore
  permissions: "0700"
  encoding: b64
  content: __CHECK_SCRIPT__
- path: /opt/kine-connections.sh
  permissions: "0700"
  encoding: b64
  content: __CONNECTIONS_SCRIPT__
- path: /etc/kine/connections.env
  permissions: "0644"
  content: |
    KINE_POSTGRES_MAX_CONNECTIONS=__POSTGRES_MAX_CONNECTIONS__
    KINE_DATASTORE_MAX_OPEN_CONNECTIONS=__KINE_MAX_OPEN_CONNECTIONS__
    KINE_DATASTORE_MAX_IDLE_CONNECTIONS=__KINE_MAX_IDLE_CONNECTIONS__
- path: /opt/configure-kine-storage.sh
  permissions: "0700"
  encoding: b64
  content: __STORAGE_SCRIPT__
- path: /etc/kine/ca.crt
  permissions: "0644"
  encoding: b64
  content: __CA_CERT__
- path: /etc/kine/server.crt
  permissions: "0644"
  encoding: b64
  content: __SERVER_CERT__
- path: /etc/kine/server.key
  permissions: "0600"
  encoding: b64
  content: __SERVER_KEY__
- path: /etc/kine/client.crt
  permissions: "0600"
  encoding: b64
  content: __CLIENT_CERT__
- path: /etc/kine/client.key
  permissions: "0600"
  encoding: b64
  content: __CLIENT_KEY__
- path: /etc/systemd/system/kine.service
  permissions: "0644"
  content: |
    [Unit]
    Description=Kine Kubernetes datastore (experimental)
    Requires=postgresql.service
    After=network-online.target postgresql.service
    Wants=network-online.target

    [Service]
    User=kine
    Group=kine
    Environment="KINE_ENDPOINT=postgres://kine@/kine?host=/var/run/postgresql&sslmode=disable"
    EnvironmentFile=/etc/kine/connections.env
    Environment="KINE_METRICS_ENABLE_PROFILING=__METRICS_PROFILING__"
    ExecStart=/usr/local/bin/kine --listen-address=0.0.0.0:2379 --server-cert-file=/etc/kine/server.crt --server-key-file=/etc/kine/server.key --trusted-ca-file=/etc/kine/ca.crt --metrics-bind-address=__METRICS_BIND_ADDRESS__:8080
    Restart=on-failure
    RestartSec=5
    NoNewPrivileges=true
    ProtectSystem=strict
    ProtectHome=true
    PrivateTmp=true

    [Install]
    WantedBy=multi-user.target
- path: /usr/local/bin/collect-kine-compactions
  permissions: "0700"
  content: |
    #!/usr/bin/env bash
    set -euo pipefail
    # Retain the entire compaction timeline, not SQL payloads or only the journal tail.
    encoded=$(journalctl --quiet --no-pager --boot --unit kine --output short-iso-precise |
      awk '{
        gsub(/\033\[[0-9;]*m/, "")
        if ($0 ~ /^[^ ]+ [^ ]+ kine\[[0-9]+\]: (INFO|ERRO)\[[^]]+\] (COMPACT compacted from|Compact failed:|Post-compact operations failed:)/) print
      }' |
      gzip -c | base64 | tr -d '\n')
    # Azure Run Command returns only a small stdout tail. Never accept silent truncation.
    if (( ${#encoded} > 3000 )); then
      echo "Compressed compaction history exceeds the Run Command output budget." >&2
      exit 1
    fi
    printf 'KINE_COMPACTIONS_BEGIN\n%s\nKINE_COMPACTIONS_END\n' "${encoded}"
- path: /opt/install-kine.sh
  permissions: "0700"
  content: |
    #!/usr/bin/env bash
    set -euo pipefail
    curl --fail --show-error --silent --location --retry 5 \
      https://github.com/k3s-io/kine/releases/download/v0.17.2/kine-amd64 \
      -o /usr/local/bin/kine
    echo '7c41cf189ecf21660bda78f1d35cc0d188c103d1809933523a8c7dde2cc58c1e  /usr/local/bin/kine' | sha256sum --check
    chmod 0755 /usr/local/bin/kine
    /opt/configure-kine-storage.sh
    useradd --system --home-dir /var/lib/kine --create-home --shell /usr/sbin/nologin kine
    chown kine:kine /etc/kine/server.key
    systemctl start postgresql
    runuser -u postgres -- createuser kine
    runuser -u postgres -- createdb --owner=kine kine
    systemctl daemon-reload
    systemctl enable --now kine
    /usr/local/bin/check-datastore kine-postgres
runcmd:
- [bash, /opt/install-kine.sh]
