# Only the public CA is distributed; no client or CA signing key is needed.
apiVersion: v1
kind: Secret
metadata:
  name: kine-metrics-ca
  namespace: monitoring
type: Opaque
data:
  ca.crt: "{{.CL2_KINE_CA_CERT_B64}}"
---
apiVersion: v1
kind: Service
metadata:
  name: kine-metrics
  namespace: monitoring
  labels:
    k8s-app: kine
spec:
  ports:
  - name: https-metrics
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kine-metrics
  namespace: monitoring
subsets:
- addresses:
  - ip: 10.250.0.4
  ports:
  - name: https-metrics
    port: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kine-metrics
  namespace: monitoring
spec:
  jobLabel: k8s-app
  endpoints:
  - port: https-metrics
    scheme: https
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
    tlsConfig:
      serverName: 10.250.0.4
      ca:
        secret:
          name: kine-metrics-ca
          key: ca.crt
  selector:
    matchLabels:
      k8s-app: kine
  namespaceSelector:
    matchNames:
    - monitoring
