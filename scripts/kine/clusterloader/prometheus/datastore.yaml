# Only the public CA is distributed; no client or CA signing key is needed.
{{if eq .CL2_DATASTORE_JOB "kine"}}
apiVersion: v1
kind: Secret
metadata:
  name: "{{.CL2_DATASTORE_JOB}}-metrics-ca"
  namespace: monitoring
type: Opaque
data:
  ca.crt: "{{.CL2_KINE_CA_CERT_B64}}"
---
apiVersion: v1
kind: Service
metadata:
  name: "{{.CL2_DATASTORE_JOB}}-metrics"
  namespace: monitoring
  labels:
    k8s-app: "{{.CL2_DATASTORE_JOB}}"
spec:
  ports:
  - name: https-metrics
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: "{{.CL2_DATASTORE_JOB}}-metrics"
  namespace: monitoring
subsets:
- addresses:
  - ip: 10.250.0.4
  ports:
  - name: https-metrics
    port: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: "{{.CL2_DATASTORE_JOB}}-metrics"
  namespace: monitoring
spec:
  jobLabel: k8s-app
  endpoints:
  - port: https-metrics
    scheme: https
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
    tlsConfig:
      serverName: 10.250.0.4
      ca:
        secret:
          name: "{{.CL2_DATASTORE_JOB}}-metrics-ca"
          key: ca.crt
  selector:
    matchLabels:
      k8s-app: "{{.CL2_DATASTORE_JOB}}"
  namespaceSelector:
    matchNames:
    - monitoring
{{else}}
apiVersion: v1
kind: Service
metadata:
  name: capz-local-etcd-metrics
  namespace: kube-system
  labels:
    k8s-app: capz-local-etcd
    datastore-job: etcd
spec:
  selector:
    component: etcd
    tier: control-plane
  ports:
  - name: http-metrics
    port: 2381
    targetPort: 2381
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: capz-local-etcd-metrics
  namespace: monitoring
spec:
  jobLabel: datastore-job
  endpoints:
  - port: http-metrics
    scheme: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
  selector:
    matchLabels:
      k8s-app: capz-local-etcd
  namespaceSelector:
    matchNames:
    - kube-system
{{end}}
