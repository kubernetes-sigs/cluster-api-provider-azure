steps:
{{if eq .action "start"}}
- name: Record profiling measurement start
  measurements:
  - Identifier: ProfilingStart
    Method: Exec
    Params:
      command: ["touch", "${CL2_REPORT_DIR}/profiling-start"]
      timeout: 10s
{{end}}
- name: "{{.action}} API measurements"
  measurements:
  - Identifier: APIResponsiveness
    Method: APIResponsivenessPrometheus
    Params:
      action: {{.action}}
      enableViolations: true
      useSimpleLatencyQuery: true
  - Identifier: SuccessfulPodPatches
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      metricName: SuccessfulPodPatches
      metricVersion: v1
      unit: reqps
      queries:
      - query: sum(rate(apiserver_request_total{resource="pods",verb="PATCH",code=~"2.."}[1m]))
        aggregations: [Min, Avg, Max]
  - Identifier: PodPatchErrors
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      metricName: PodPatchErrors
      metricVersion: v1
      unit: reqps
      queries:
      - query: sum(rate(apiserver_request_total{resource="pods",verb="PATCH",code!~"2.."}[1m])) or vector(0)
        aggregations: [Avg, Max]
  - Identifier: PodPatchP99
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      metricName: PodPatchP99
      metricVersion: v1
      unit: s
      queries:
      - query: histogram_quantile(0.99, sum by (le) (rate(apiserver_request_duration_seconds_bucket{resource="pods",verb="PATCH"}[1m])))
        aggregations: [Avg, Max]
  - Identifier: PodPatchResponses
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: PodPatchResponses
      metricVersion: v1
      unit: reqps
      dimensions: [code]
      queries:
      - query: sum by (code) (rate(apiserver_request_total{resource="pods",subresource="",verb="PATCH"}[1m]))
        aggregations: [Avg, Max]
        requireSamples: true
  # CL2 enforces thresholds on instant queries, not the aggregated rates above.
  - Identifier: PodPatchErrorCount
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: PodPatchErrorCount
      metricVersion: v1
      unit: requests
      queries:
      - name: Count
        query: >-
          sum(increase(apiserver_request_total{resource="pods",subresource="",verb="PATCH",code!~"2.."}[%v]))
          or (0 * sum(increase(apiserver_request_total{resource="pods",subresource="",verb="PATCH"}[%v])))
        threshold: 0
        requireSamples: true
  - Identifier: ActiveWatches
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      metricName: ActiveWatches
      metricVersion: v1
      unit: watches
      queries:
      - query: sum(apiserver_longrunning_requests{verb="WATCH",resource="pods"})
        aggregations: [Min, Avg, Max]
  - Identifier: ContainerCPU
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      metricName: ContainerCPU
      metricVersion: v1
      unit: cores
      dimensions: [namespace, pod, container]
      queries:
      - query: sum by (namespace,pod,container) (rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[1m]))
        aggregations: [Avg, Max]
  - Identifier: LoadGeneratorCPU
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: LoadGeneratorCPU
      metricVersion: v1
      unit: cores
      dimensions: [namespace, pod, container]
      queries:
      - query: sum by (namespace,pod,container) (rate(container_cpu_usage_seconds_total{namespace=~"test-.*",container=~"(write|watch)-generator"}[1m]))
        aggregations: [Avg, Max]
        requireSamples: true
  - Identifier: LoadGeneratorCPUThrottling
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: LoadGeneratorCPUThrottling
      metricVersion: v1
      unit: percent
      dimensions: [namespace, pod, container]
      queries:
      # Idle containers have zero CFS periods; keep that ratio finite without filling missing series.
      - query: >-
          100 * sum by (namespace,pod,container) (rate(container_cpu_cfs_throttled_periods_total{namespace=~"test-.*",container=~"(write|watch)-generator"}[1m]))
          / clamp_min(sum by (namespace,pod,container) (rate(container_cpu_cfs_periods_total{namespace=~"test-.*",container=~"(write|watch)-generator"}[1m])), 1e-9)
        aggregations: [Avg, Max]
        requireSamples: true
  - Identifier: LoadGeneratorMemory
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: LoadGeneratorMemory
      metricVersion: v1
      unit: MiB
      dimensions: [namespace, pod, container]
      queries:
      - query: sum by (namespace,pod,container) (container_memory_working_set_bytes{namespace=~"test-.*",container=~"(write|watch)-generator"}) / 1048576
        aggregations: [Avg, Max]
        requireSamples: true
  - Identifier: __DATASTORE_PREFIX__ScrapeAvailability
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: __DATASTORE_PREFIX__ScrapeAvailability
      metricVersion: v1
      unit: up
      queries:
      - name: Minimum
        query: min(min_over_time(up{job="__DATASTORE_JOB__"}[%v]))
        threshold: 1
        lowerBound: true
        requireSamples: true
  - Identifier: __DATASTORE_PREFIX__CPU
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: __DATASTORE_PREFIX__CPU
      metricVersion: v1
      unit: cores
      queries:
      - query: rate(process_cpu_seconds_total{job="__DATASTORE_JOB__"}[1m])
        aggregations: [Avg, Max]
        requireSamples: true
  - Identifier: __DATASTORE_PREFIX__Memory
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: __DATASTORE_PREFIX__Memory
      metricVersion: v1
      unit: MiB
      queries:
      - name: RSS
        query: process_resident_memory_bytes{job="__DATASTORE_JOB__"} / 1048576
        aggregations: [Avg, Max]
        requireSamples: true
      - name: HeapAllocated
        query: go_memstats_heap_alloc_bytes{job="__DATASTORE_JOB__"} / 1048576
        aggregations: [Avg, Max]
        requireSamples: true
      - name: HeapInUse
        query: go_memstats_heap_inuse_bytes{job="__DATASTORE_JOB__"} / 1048576
        aggregations: [Avg, Max]
        requireSamples: true
  - Identifier: __DATASTORE_PREFIX__Goroutines
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: __DATASTORE_PREFIX__Goroutines
      metricVersion: v1
      unit: goroutines
      queries:
      - query: go_goroutines{job="__DATASTORE_JOB__"}
        aggregations: [Avg, Max]
        requireSamples: true
  - Identifier: __DATASTORE_PREFIX__GCCollections
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: __DATASTORE_PREFIX__GCCollections
      metricVersion: v1
      unit: collections/s
      queries:
      - query: rate(go_gc_duration_seconds_count{job="__DATASTORE_JOB__"}[1m])
        aggregations: [Avg, Max]
        requireSamples: true
  - Identifier: __DATASTORE_PREFIX__GCPauseTime
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: __DATASTORE_PREFIX__GCPauseTime
      metricVersion: v1
      unit: s/s
      queries:
      - query: rate(go_gc_duration_seconds_sum{job="__DATASTORE_JOB__"}[1m])
        aggregations: [Avg, Max]
        requireSamples: true
