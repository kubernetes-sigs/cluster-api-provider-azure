  - Identifier: EtcdLeaderAvailability
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: EtcdLeaderAvailability
      metricVersion: v1
      unit: leader
      queries:
      - name: Minimum
        query: min(min_over_time(etcd_server_has_leader{job="etcd"}[%v]))
        threshold: 1
        lowerBound: true
        requireSamples: true
  - Identifier: EtcdDatabaseSize
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: EtcdDatabaseSize
      metricVersion: v1
      unit: MiB
      queries:
      - name: Total
        query: etcd_mvcc_db_total_size_in_bytes{job="etcd"} / 1048576
        aggregations: [Avg, Max]
        requireSamples: true
      - name: InUse
        query: etcd_mvcc_db_total_size_in_use_in_bytes{job="etcd"} / 1048576
        aggregations: [Avg, Max]
        requireSamples: true
      - name: Quota
        query: etcd_server_quota_backend_bytes{job="etcd"} / 1048576
        aggregations: [Avg, Max]
        requireSamples: true
  - Identifier: EtcdWALFsyncP99
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: EtcdWALFsyncP99
      metricVersion: v1
      unit: s
      queries:
      - query: >-
          histogram_quantile(0.99, sum by (le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{job="etcd"}[1m])))
          and on () (sum(rate(etcd_disk_wal_fsync_duration_seconds_count{job="etcd"}[1m])) > 0)
        aggregations: [Avg, Max]
        requireSamples: true
  - Identifier: EtcdBackendCommitP99
    Method: GenericPrometheusQuery
    Params:
      action: {{.action}}
      enableViolations: true
      metricName: EtcdBackendCommitP99
      metricVersion: v1
      unit: s
      queries:
      - query: >-
          histogram_quantile(0.99, sum by (le) (rate(etcd_disk_backend_commit_duration_seconds_bucket{job="etcd"}[1m])))
          and on () (sum(rate(etcd_disk_backend_commit_duration_seconds_count{job="etcd"}[1m])) > 0)
        aggregations: [Avg, Max]
        requireSamples: true
