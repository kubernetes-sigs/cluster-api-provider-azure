apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
namespace: capz-system
resources:
  # The ASO version here is managed by `make generate-aso-crds`
  - https://github.com/stolostron/azure-service-operator/releases/download/v2.19.0-hcpclusters.1/azureserviceoperator_v2.19.0-hcpclusters.1.yaml
  - crds.yaml
  - settings.yaml
patches:
  - path: patches/migrate_stored_versions.yaml
    target:
      group: apps
      kind: Deployment
      name: azureserviceoperator-controller-manager
      version: v1
  - patch: |- # default kustomization includes a namespace already
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: azureserviceoperator-system
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: quay.io/capz/azureserviceoperator:v2.19.0-hcpclusters.1
      - op: replace
        path: /spec/replicas
        value: 1
      - op: test
        path: /spec/template/spec/containers/0/args/6
        value: --crd-pattern=
      - op: replace # Users can specify additional ASO CRDs. CRDs should be appended with ';'
        path: /spec/template/spec/containers/0/args/6
        value: --crd-pattern=${ADDITIONAL_ASO_CRDS:= }
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 10
          failureThreshold: 12
    target:
      group: apps
      kind: Deployment
      name: azureserviceoperator-controller-manager
      version: v1
  - patch: |- # Grant the ASO controller's SA permission to delete the CRDs it
      # manages. The migrate-aso-crd-stored-versions init container deletes
      # CRDs that have stale entries in status.storedVersions which the new
      # bundle no longer lists in spec.versions; the new ASO controller then
      # re-creates them from its bundled definitions.
      - op: test
        path: /rules/0/resources/0
        value: customresourcedefinitions
      - op: add
        path: /rules/-
        value:
          apiGroups:
            - apiextensions.k8s.io
          resources:
            - customresourcedefinitions
          resourceNames:
            - fleetsmembers.containerservice.azure.com
            - maintenanceconfigurations.containerservice.azure.com
            - managedclusters.containerservice.azure.com
            - managedclustersagentpools.containerservice.azure.com
            - extensions.kubernetesconfiguration.azure.com
            - bastionhosts.network.azure.com
            - natgateways.network.azure.com
            - privateendpoints.network.azure.com
            - virtualnetworks.network.azure.com
            - virtualnetworkssubnets.network.azure.com
            - resourcegroups.resources.azure.com
            - networksecuritygroups.network.azure.com
            - roleassignments.authorization.azure.com
            - userassignedidentities.managedidentity.azure.com
            - vaults.keyvault.azure.com
            - hcpopenshiftclusters.redhatopenshift.azure.com
            - hcpopenshiftclustersnodepools.redhatopenshift.azure.com
            - hcpopenshiftclustersexternalauths.redhatopenshift.azure.com
          verbs:
            - delete
    target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: azureserviceoperator-crd-manager-role
      version: v1
replacements:
  - source:
      fieldPath: metadata.namespace
      group: cert-manager.io
      kind: Certificate
      name: azureserviceoperator-serving-cert
      version: v1
    targets:
      - fieldPaths:
          - metadata.annotations.cert-manager\.io/inject-ca-from
        options:
          delimiter: /
        select:
          annotationSelector: cert-manager.io/inject-ca-from
          version: v1
      - fieldPaths:
          - spec.dnsNames.0
          - spec.dnsNames.1
        options:
          delimiter: .
          index: 1
        select:
          group: cert-manager.io
          kind: Certificate
          name: azureserviceoperator-serving-cert
          version: v1
